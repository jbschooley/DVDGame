<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Game</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="timer">0:60</div>
      <div id="speed">Speed: 112</div>
    </div>
    <canvas id="game" width="900" height="540"></canvas>
    <div id="corner-tl" class="corner-indicator"></div>
    <div id="corner-tr" class="corner-indicator"></div>
    <div id="corner-bl" class="corner-indicator"></div>
    <div id="corner-br" class="corner-indicator"></div>
    <div id="overlay">
      <div id="overlay-content">
        <h1>DVD Game</h1>
        <p>Press Space or Enter to start</p>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
