<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DVD Game</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="hud">
        <div id="hud-score">Score: 0</div>
        <div id="hud-timer">1:00</div>
        <div id="hud-speed">Speed: 112</div>
      </div>
      <canvas id="game"></canvas>
      <div id="overlay" class="active">
        <div id="overlay-content">
          <h1>DVD Game</h1>
          <p>Press <strong>Space</strong> or <strong>Enter</strong> to start</p>
          <p class="instructions">Arrow keys / WASD to change direction</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
